# HorizonNET per Docker Compose.
#
#   cp .env.example .env   # Werte anpassen
#   docker compose up -d --build
#
# Details: README.md, Abschnitt "Docker".
services:
  horizonnet:
    build: .
    image: horizonnet:latest
    container_name: horizonnet
    restart: unless-stopped
    # Hinter einem Reverse Proxy: HORIZON_PORT=127.0.0.1:8080 (nur lokal) oder den
    # Port gar nicht veröffentlichen und den Proxy über ein gemeinsames Docker-Netz
    # anbinden – sonst erreichen Clients die App am Proxy vorbei (README, "Reverse Proxy").
    ports:
      - "${HORIZON_PORT:-8080}:8080"
    environment:
      # Hostnamen, unter denen die App erreichbar ist (Semikolon-getrennt). Standard wie
      # appsettings.json; für den Zugriff per Domain oder IP in .env ergänzen.
      AllowedHosts: "${HORIZON_ALLOWED_HOSTS:-localhost;127.0.0.1}"
      # Benutzerkonto – wird nur beim allerersten Start angelegt. Das Passwort bleibt
      # per "docker inspect" lesbar: nach dem ersten Start aus .env entfernen.
      Auth__Username: "${HORIZON_USERNAME:-}"
      Auth__InitialPassword: "${HORIZON_INITIAL_PASSWORD:-}"
      # false nur ohne HTTPS (Zugriff direkt per http://server:port)
      Auth__SecureCookie: "${HORIZON_SECURE_COOKIE:-true}"
      # IP bzw. eigenes Netz des Reverse Proxys, dessen X-Forwarded-Header vertraut wird
      ForwardedHeaders__KnownNetworks: "${HORIZON_TRUSTED_PROXIES:-}"
      # Google-Kalender (optional; Nextcloud wird in der App eingerichtet)
      Google__ClientId: "${GOOGLE_CLIENT_ID:-}"
      Google__ClientSecret: "${GOOGLE_CLIENT_SECRET:-}"
      # Neue Versionen in den Einstellungen melden (Off = nicht prüfen). Installieren kann
      # der Container sich nicht selbst: git pull && docker compose up -d --build
      Update__Mode: "${HORIZON_UPDATE_MODE:-Notify}"
      TZ: "${TZ:-Europe/Berlin}"
    volumes:
      - horizonnet-data:/data

volumes:
  horizonnet-data:
